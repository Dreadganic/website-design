# Beju on Netlify: the site is in beju-site/, the payment functions in netlify/functions/.
# Deploy with Git (recommended) or the Netlify CLI. Drag-and-drop deploys don't include functions.
[build]
  publish = "beju-site"
  functions = "netlify/functions"
  # Deploy Previews and branch deploys (free): only build when the site or the functions changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- beju-site netlify/functions netlify/edge-functions netlify/lib netlify.toml package.json package-lock.json"

[context.production]
  # Production deploys cost 15 credits each, so a push to main publishes only when a commit message in it says [deploy].
  # Build hooks and "Clear cache and deploy site" always publish. See netlify/deploy-gate.sh.
  ignore = "bash netlify/deploy-gate.sh"

[functions]
  node_bundler = "esbuild"
