<title>Beju Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* One cozy world: a dark-wood frame around the farm, parchment panels, pixel type for game labels */
:root {
  --wood: #3A2A1C; --wood-2: #4E3826; --ink: #3E2A1C; --muted: #7A5A3A; --paper: #F4E6C6; --paper-2: #E8D4A8;
  --edge: #6E4624; --gold: #F2C04A; --leaf: #8CB04A; --leaf-ink: #5E7E2C; --cherry: #D84A36; --sky: #7EC8F0; --off: #D8C8A8;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--wood); }
body { color: var(--ink); font-family: var(--pixel); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; }
.app { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
button { font-family: var(--pixel); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.card { background: var(--paper); border: 3px solid var(--edge); border-radius: 10px; box-shadow: inset 0 0 0 2px var(--paper-2), 0 3px 0 #1E140C; }
.top { display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
.top .name { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }
.top .name b { display: block; font-size: 18px; }
.top .name span { font-size: 12px; color: var(--muted); }
.arrow { width: 38px; height: 38px; border: 2px solid var(--edge); border-radius: 8px; background: var(--paper-2); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 5px; color: #fff; white-space: nowrap; }
.stage { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 3px #1E140C; background: #5E7A2C; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; }
.hud-l { position: absolute; left: 6px; top: 6px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.sound { position: absolute; left: 6px; bottom: 6px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: rgba(62,42,28,0.8); color: #FFF4DE; cursor: pointer; }

.sound.music { left: 46px; }
.sound .slash { display: none; }
.sound[aria-pressed="false"] .slash { display: inline; }
.hud-r { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
.hearts { display: flex; gap: 1px; flex-wrap: wrap; max-width: 150px; }
.pill { display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 10px; background: rgba(62,42,28,0.8); color: #FFF4DE; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

.clock { display: flex; align-items: center; gap: 5px; }
.clockbox { background: var(--paper); border: 3px solid var(--edge); border-radius: 8px; overflow: hidden; text-align: center; box-shadow: 0 2px 0 var(--ink); }
.clockbox .sky { height: 16px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--edge); }

.n { font-family: var(--body); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; font-size: 1.1em; line-height: 1; }

.note .n, .grow span .n, .tile span .n, .btn small .n, .pill .n, .toast .n, .goldgo .n, .stats .n, .rack small .n, .nb-row .n { font-size: 1em; }
.pill, .toast, .goldgo, .btn small, .stats b, .stats small, .fit, .want, .tile .tags > span { font-family: var(--body); font-weight: 700; font-variant-numeric: tabular-nums; }
.pc-num .n, .lvl-badge .n { font-family: inherit; }

.req { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; margin: 8px 0; border: 2px solid #A87818; border-radius: 8px; background: #FFF6D8; }

.nbw { overflow-x: auto; border: 2px solid var(--paper-2); border-radius: 8px; background: #FBF4E2; }
.nb { border-collapse: collapse; width: 100%; font-size: 11px; }
.nb th, .nb td { padding: 4px 3px; text-align: center; border-bottom: 1px dashed var(--paper-2); vertical-align: middle; }
.nb th small, .nb td small { display: block; font-family: var(--body); font-size: 9px; color: var(--muted); line-height: 1.1; }
.nb tbody th { text-align: left; white-space: nowrap; } .nb tbody th img { vertical-align: middle; }
.nb tbody th small { display: inline; font-size: 10px; margin-left: 3px; color: var(--ink); }
.nb td b { color: #A87818; font-size: 12px; letter-spacing: -1px; }
.nb td.off b { color: #C8BCA4; } .nb td.full { background: #FFF1C4; } .nb td.asked { box-shadow: inset 0 0 0 2px #E8B830; background: #FFF6D8; }
.rrow { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 2px dashed var(--paper-2); }
.rrow-t { display: flex; gap: 8px; align-items: center; } .rrow-t > div { display: flex; flex-direction: column; min-width: 0; }
.rrow-t b { font-size: 14px; } .rrow-t span { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--muted); }
.rrow .seg .btn { flex: 1 1 0; min-width: 0; }
.roasters { display: flex; flex-direction: column; gap: 6px; }
.rslot { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 2px solid var(--paper-2); border-radius: 8px; background: #FBF4E2; }
.rslot > div { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rslot b { font-size: 13px; } .rslot small { font-family: var(--body); font-size: 11px; font-weight: 700; color: var(--muted); }
.rslot.idle span { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--muted); }
.rslot.crack { border-color: #E8602A; background: #FFF0E0; animation: crackpulse 0.5s infinite alternate; }
@keyframes crackpulse { to { box-shadow: 0 0 0 3px #F2C04A; } }
@media (prefers-reduced-motion: reduce) { .rslot.crack { animation: none; } }
.toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: 92%; padding: 8px 12px; background: var(--paper); border: 3px solid var(--edge); border-radius: 10px; font-size: 15px; text-align: center; box-shadow: 0 3px 0 #1E140C; pointer-events: none; }
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.tab { height: 46px; border: 3px solid var(--edge); border-radius: 8px; background: var(--paper-2); color: var(--ink); font-size: 10.5px; letter-spacing: -0.02em; padding: 0 1px; min-width: 0; overflow: hidden; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
.tab[aria-pressed="true"] { background: var(--gold); }

.panel { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

.panel h3 { margin: 0; font-size: 15px; font-weight: 700; }

.row:first-of-type { border-top: 0; }

.art { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; background: var(--paper-2); border: 2px solid var(--edge); border-radius: 6px; overflow: hidden; }
.art img { image-rendering: pixelated; max-width: 44px; max-height: 44px; }
.btn { min-width: 76px; min-height: 44px; padding: 4px 10px; border: 3px solid var(--edge); border-radius: 8px; background: var(--gold); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn small { font-size: 11px; font-weight: 600; }
.btn.green { background: #9CC860; } .btn.blue { background: #9CCCF0; }

.btn:active:not(:disabled) { transform: translateY(2px); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.stamps { display: flex; gap: 6px; flex-wrap: wrap; }
.stamps img { width: 40px; height: 40px; image-rendering: pixelated; }
.stamps .off { opacity: 0.25; filter: grayscale(1); }
.modal { position: fixed; inset: 0; background: rgba(20,12,6,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal[hidden] { display: none; }
button, a.btn, [data-act], [data-tab] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.ccards { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
.ccard { flex: 0 0 220px; scroll-snap-align: start; display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: var(--paper-2); border: 2px solid var(--edge); border-radius: 8px; }
.ccard.ev { border-color: #C86C8E; background: #FFF0F5; }
.cc-t { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; font-size: 12px; }
.cc-t b { font-size: 14px; } .cc-t span { font-weight: 700; color: var(--muted); } .cc-t small { font-size: 11px; font-weight: 700; color: var(--muted); }
.cc-t .bar { height: 6px; }
.cc-x { width: 32px; height: 32px; flex: none; border: 2px solid var(--edge); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 700; }
.tile { position: relative; }
.tile.best { border-color: #2D6A46; box-shadow: 0 0 0 2px #2D6A46 inset; }
.tags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
.tile .tags > span, .fit, .want { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
.tile .tags .bestpay { background: #2D6A46; color: #FBF1DC; }
.tile .tags .fit, .fit { background: #F2C04A; color: #3E2A1C; }
.tile .tags .est { background: #EFE2C4; color: #5A4630; }
.want { background: #F2C04A; color: #3E2A1C; margin-left: 2px; }
.bneck { padding: 8px 10px; background: #FBE3D6; border: 2px solid #B4502C; border-radius: 8px; font-size: 13px; color: #5A2A14; line-height: 1.45; }
.drop { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: linear-gradient(90deg, #FFE4EE, #FFF1C4); border: 2px solid #C86C8E; border-radius: 8px; margin-bottom: 4px; }
.drop div { display: flex; flex-direction: column; min-width: 0; }
.drop b { font-size: 14px; } .drop span { font-size: 12px; font-weight: 700; color: #7A5A3A; }
.push { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 14px; background: #F4F4F6; color: #1E1E22; box-shadow: 0 2px 8px rgba(0,0,0,0.18); font-family: -apple-system, system-ui, sans-serif; font-size: 13px; }
.push-app { font-size: 11px; color: #6E6E76; letter-spacing: 0.04em; }
.season { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 8px 10px; background: #E2F0E6; border: 2px solid #2D6A46; border-radius: 8px; font-size: 13px; }
.plate .charm { width: 14px; height: 14px; image-rendering: pixelated; vertical-align: -2px; margin-left: 4px; }
.rbadge { width: 16px; height: 16px; image-rendering: pixelated; vertical-align: -3px; margin-left: 4px; }
.badge.gold { border-color: #E8B830; box-shadow: 0 0 0 2px #FFF1C4, 0 0 0 4px #E8B830; }
.track { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }

.tier.cos { border-color: #E8B830; background: #FFF6D8; }

.season span { font-weight: 700; color: #3E5A48; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { display: flex; flex-direction: column; align-items: center; padding: 4px 8px; border-radius: 8px; border: 2px solid #A87818; background: #FFF1C4; font: 700 12px 'Pixelify Sans', monospace; }
.badge small { font: 700 10px var(--body, sans-serif); color: #7A5A3A; }
.badge.r1 { background: linear-gradient(#FFF4B0, #F2C04A); } .badge.r99 { border-color: #C86C8E; background: #FFE4EE; }
.hn { font-size: 12px; color: #FFF4DE; margin-left: 3px; text-shadow: 1px 1px 0 #3E2A1C; }
.guide { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #2D6A46; color: #FBF1DC; border: 3px solid #1E4A30; border-radius: 10px; font-weight: 700; font-size: 13px; }
.guide[hidden] { display: none; }
.gstep { font: 700 12px 'Pixelify Sans', monospace; background: #F2C04A; color: #3E2A1C; border-radius: 6px; padding: 1px 6px; flex: none; }
.gtext { flex: 1; min-width: 0; }
.gskip { border: 0; background: transparent; color: #CDE8D6; font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; flex: none; }
[hidden] { display: none !important; }   /* a hidden element must never cover the game, whatever its own display rule */
/* the prestige ceremony: a full-screen moment, timed to the anthem */
.pcer { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 42%, #4A3418 0%, #1E140A 70%); color: #FFF4DE; text-align: center; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
.pcer canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pc-rays { position: absolute; left: 50%; top: 42%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; background: repeating-conic-gradient(from 0deg, rgba(255,226,122,0.16) 0 6deg, transparent 6deg 18deg); opacity: 0; animation: pcfade 0.6s 1.1s forwards, pcspin 24s linear infinite; }
.pc-flash { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; animation: pcflash 0.9s 1.12s ease-out; pointer-events: none; }
.pc-body { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 360px; }
.pc-kicker { font: 700 13px/1 "Pixelify Sans", monospace; letter-spacing: 0.3em; color: #F2C04A; opacity: 0; animation: pcfade 0.5s 0.2s forwards; }
.pc-num { font: 700 64px/1 "Pixelify Sans", monospace; color: #FFE27A; text-shadow: 0 0 18px rgba(242,192,74,0.9), 0 4px 0 #6A4A10; opacity: 0; transform: scale(0.2); animation: pcslam 0.5s 1.15s cubic-bezier(.2,1.6,.4,1) forwards; }
.pc-crest { opacity: 0; transform: scale(0) rotate(-200deg); animation: pccrest 0.9s 1.3s cubic-bezier(.2,1.3,.4,1) forwards; filter: drop-shadow(0 0 16px rgba(255,226,122,0.9)); }
.pc-tier { font: 700 26px/1.1 "Pixelify Sans", monospace; letter-spacing: 0.04em; opacity: 0; animation: pcup 0.6s 2.0s forwards; }
.pc-plate { opacity: 0; animation: pcup 0.6s 2.3s forwards; }
.pc-plate .plate { font-size: 16px; padding: 4px 12px; }
.pc-sub { font-size: 14px; color: #E8D8B8; opacity: 0; animation: pcup 0.6s 2.7s forwards; }
.pc-sub b { color: #FFE27A; }
.pc-go { opacity: 0; animation: pcup 0.5s 3.4s forwards; margin-top: 6px; }
.shake { animation: pcshake 0.5s 1.15s; }
@keyframes pcfade { to { opacity: 1; } }
@keyframes pcspin { to { transform: rotate(360deg); } }
@keyframes pcflash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
@keyframes pcslam { to { opacity: 1; transform: scale(1); } }
@keyframes pccrest { to { opacity: 1; transform: scale(1) rotate(0deg); } }
@keyframes pcup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pcshake { 0%, 100% { transform: none; } 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
@media (prefers-reduced-motion: reduce) { .pc-rays, .pc-flash, .shake { animation: none !important; } .pc-rays { opacity: 1; } .pc-kicker, .pc-num, .pc-crest, .pc-tier, .pc-plate, .pc-sub, .pc-go { animation: none !important; opacity: 1; transform: none; } }
.rackbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.rackbar .btn { flex: 1 1 120px; }
.rackview { flex: 0 0 auto; }

.rk-dry { font: 700 11px var(--pixel); color: var(--leaf-ink); }
.rack .fit { align-self: flex-start; font-size: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

const panelBusy = () => touchDown || performance.now() - lastSwipe < 900 || performance.now() - lastUp < 350;
document.addEventListener('pointerdown', () => { touchDown = true; }, true);
window.addEventListener('pointerup', () => { touchDown = false; lastUp = performance.now(); }, true);
window.addEventListener('pointercancel', () => { touchDown = false; lastUp = performance.now(); }, true);
$('panel').addEventListener('scroll', () => { lastSwipe = performance.now(); }, true);   /* catches the strip's scrolling too */
function refreshAll() { seasonTick(); refreshHud(); renderTabs(); renderPanel(); renderGuide(); }

/* ---------- online: accounts, cloud save, live leaderboard, order links, drop events ----------
   Only on bejucoffee.com (or a Netlify preview); the Claude preview has no network, so the game stays offline there. */
const API = /(^|\.)bejucoffee\.com$|\.netlify\.app$|^localhost$/.test(location.hostname) ? '/.netlify/functions/' : '';
const NET = { acct: null, ver: 0, board: {}, boardAt: {}, status: API ? 'connecting' : 'offline', lastSync: 0, lastScore: '' };
try { NET.acct = JSON.parse(localStorage.getItem('beju-farm-account') || 'null'); } catch (e) { /* storage blocked */ }
async function api(path, method, body) {
  const r = await fetch(API + path, { method: method || 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, NET.acct ? { Authorization: 'Bearer ' + NET.acct.player + '.' + NET.acct.token } : {}), body: body ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await r.json(); } catch (e) { /* empty body */ }
  return { status: r.status, data };
}
const keepAcct = () => { try { localStorage.setItem('beju-farm-account', JSON.stringify(NET.acct)); } catch (e) { /* storage blocked */ } };
async function online() {
  if (!API) return;
  try {
    if (!NET.acct) { const r = await api('game-account', 'POST', { name: S.name }); if (r.status !== 201) throw new Error('account'); NET.acct = { player: r.data.player, token: r.data.token, ver: 0 }; keepAcct(); }
    NET.ver = NET.acct.ver || 0;
    const sv = await api('game-save');
    if (sv.status === 200 && !sv.data.none) {
      NET.ver = sv.data.version;
      if ((sv.data.data.last || 0) > (S.last || 0) + 60000) showModal('<h2>Newer save found</h2><p class="note">Your farm has newer progress from another device (' + new Date(sv.data.at).toLocaleString() + ').</p><button class="btn green" data-act="cloudLoad">Load it</button><button class="btn" data-act="close">Keep this one</button>'), NET.pending = sv.data.data;
    }
    const claim = new URLSearchParams(location.search).get('claim');
    if (claim) { const r = await api('game-claim', 'POST', { session_id: claim }); if (r.status === 200 && !r.data.again) applyGrant(r.data); else if (r.status !== 200) toast(r.data.error === 'claimed_by_another_player' ? 'That order is linked to another farm' : 'Could not link that order yet'); history.replaceState(null, '', location.pathname); }
    const ev = await api('game-events');
    const live = ev.status === 200 && ev.data.events.find((x) => x.live);
    if (live && (!S.event || S.event.id !== live.id)) startDrop(live.id, live);
    NET.status = 'online'; cloudSync(); await submitScore(); syncSamples();
    const gr = await api('game-grants', 'POST', {}).catch(() => null);
    if (gr && gr.status === 200) gr.data.grants.forEach((g) => applyGrant({ cranes: g.cranes, coffees: [], order: g.order + (g.reason === 'subscription' ? ' (subscription renewal)' : '') }));
  } catch (e) { NET.status = 'offline'; }
}
async function cloudSync(force) {
  if (!API || !NET.acct || NET.status !== 'online') return;
  if (!force && Date.now() - NET.lastSync < 60000) return;
  NET.lastSync = Date.now(); save();
  const data = JSON.parse(JSON.stringify(S, (k, v) => (k === 'target' || k === 'claim' || k === 'path') ? undefined : v));
  const r = await api('game-save', 'PUT', { base: NET.ver, data }).catch(() => null);
  if (r && r.status === 200) { NET.ver = r.data.version; NET.acct.ver = NET.ver; keepAcct(); }
  else if (r && r.status === 409) { NET.ver = r.data.version; if ((r.data.data.last || 0) > (S.last || 0)) { NET.pending = r.data.data; showModal('<h2>Newer save found</h2><p class="note">Another device saved more recent progress.</p><button class="btn green" data-act="cloudLoad">Load it</button><button class="btn" data-act="close">Keep this one</button>'); } else cloudSync(true); }
}
async function submitScore() {
  if (!API || !NET.acct || NET.status !== 'online') return;
  seasonTick();   /* never send last season's stars into a new season */
  const body = { name: S.name, prestige: S.prestige, seasonP: S.season.prestige, seasonKh: Math.floor(S.season.kh || 0), seasonStars: S.season.stars, level: level(), points: Math.floor(S.xp), look: S.look }, sig = JSON.stringify(body);
  if (sig === NET.lastScore) return;
  const r = await api('game-score', 'POST', body).catch(() => null);
  if (r && r.status === 200) { NET.lastScore = sig; NET.rank = r.data.rank; } else if (r && r.status === 422) NET.scoreError = r.data.error;
}
async function syncSamples() {   /* the server's sample list is the real one; local ones it hasn't confirmed show as pending */
  if (!API || !NET.acct || NET.status !== 'online') return;
  const r = await api('game-samples', 'POST', {}).catch(() => null);
  if (!r || r.status !== 200) return;
  const server = r.data.samples.map((s) => Object.assign(s, { local: false }));
  S.samples = server.concat(S.samples.filter((s) => s.local && !server.some((x) => x.id === s.id)).map((s) => Object.assign(s, { status: 'pending' })));
}
async function liveBoard(mode) {
  if (!API || NET.status !== 'online') return null;
  if (NET.board[mode] && Date.now() - NET.boardAt[mode] < 30000) return NET.board[mode];
  NET.boardAt[mode] = Date.now();
  const r = await api('game-score?mode=' + mode).catch(() => null);
  if (r && r.status === 200) { NET.board[mode] = r.data; if (tab === 'ranks') renderPanel(); }
  return NET.board[mode] || null;
}
setInterval(() => { cloudSync(); submitScore(); }, 30000);

/* ---------- start: offline earnings, intro, loop ---------- */
const awayMs = Date.now() - (S.last || Date.now());
checkSamples(true);   /* a save already past a milestone gets its samples */
refreshAll();
if (awayMs > 5 * 60 * 1000) away(Math.min(awayCap(), Math.round(awayMs / 3600000 * 10) / 10 || 0.1));
else if (S.intro === 0) showModal('<img src="' + url('worker_down_0', { shirt: ART.shirts[0] }) + '" alt="" style="width:48px;image-rendering:pixelated"><h2>Welcome to Beju Farm</h2><p class="note">Your first coffee farm, in Brazil. Follow the goal under the farm to learn the basics; new tabs open as you go.</p><p class="note"><b>Coins</b> build and hire. <b>Know-how</b> unlocks new coffees, farms and processes. <b>Cranes</b> come from real Beju orders.</p><button class="btn green" data-act="close">Start farming</button>');
let last = performance.now(), uiT = 0, saveT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  tick(dt); draw(t / 1000);
  uiT += dt; saveT += dt;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
  if (uiT > 0.5) { uiT = 0; refreshHud(); syncMusic(); if (!panelBusy()) { if (!(document.activeElement && document.activeElement.id === 'nameIn')) renderPanel(); checkTabs(); renderTabs(); renderGuide(); } }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
online();
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); cloudSync(true); } });
let soundReady = false;
function audioStart() {   /* browsers only allow sound after a tap, so everything starts on the first one */
  if (soundReady) return; soundReady = true;
  setTimeout(() => { if ($('modal').hidden) { checkIn(); refreshAll(); } else { const w = setInterval(() => { if ($('modal').hidden) { clearInterval(w); checkIn(); refreshAll(); } }, 500); } }, 400);
  SFX.unlock(); Cozy.init(SFX.context()); syncMusic();
}
document.addEventListener('pointerdown', audioStart, true);
const trackFor = () => (scene() === 'roast' ? 'roastery' : S.loc);   /* every farm plays its own theme, open or not; the roastery has its own kissaten jazz */
function syncMusic() {
  Cozy.setVolume(S.musicVol); Cozy.setEnabled(S.music);
  const hr = S.minutes / 60; Cozy.setNight(hr >= 19 || hr < 6);
  if (soundReady && Cozy.current() !== trackFor()) Cozy.play(trackFor());
}
const BIG = new Set(['coins', 'levelup', 'achieve', 'contract', 'build', 'crane']);
SFX.onPlay = (n) => { if (BIG.has(n)) Cozy.duck(); };
function syncSound() {
  SFX.setEnabled(S.sfx); $('sfxBtn').setAttribute('aria-pressed', String(S.sfx)); $('sfxBtn').setAttribute('aria-label', S.sfx ? 'Sound effects on' : 'Sound effects off');
  $('musicBtn').setAttribute('aria-pressed', String(S.music)); $('musicBtn').setAttribute('aria-label', S.music ? 'Music on' : 'Music off');
}
$('sfxBtn').addEventListener('click', () => { S.sfx = !S.sfx; syncSound(); if (S.sfx) SFX.play('tick'); });
$('musicBtn').addEventListener('click', () => { S.music = !S.music; syncSound(); syncMusic(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) Cozy.pause(); else Cozy.resume(); });
syncSound();
window.addEventListener('pagehide', save);
})();
</script>
