<title>Beju Farm</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* One cozy world: a dark-wood frame around the farm, parchment panels, pixel type for game labels */
:root {
  --wood: #3A2A1C; --wood-2: #4E3826; --ink: #3E2A1C; --muted: #7A5A3A; --paper: #F4E6C6; --paper-2: #E8D4A8;
  --edge: #6E4624; --gold: #F2C04A; --leaf: #8CB04A; --leaf-ink: #5E7E2C; --cherry: #D84A36; --sky: #7EC8F0; --off: #D8C8A8;
  --pixel: 'Pixelify Sans', ui-monospace, monospace; --body: 'Zen Kaku Gothic New', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--wood); }
body { margin: 0; color: var(--ink); font-family: var(--pixel); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* one screen, no page scroll: farm bar on top, the map in the middle, tabs along the bottom. A tab opens as a sheet over the lower half of the map */
.app { --pb: max(10px, env(safe-area-inset-bottom, 0px)); --dock: calc(var(--pb) + 52px); --sh: max(50%, calc(var(--dock) + 320px)); --ar: 192 / 352; position: relative; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; height: 100vh; height: 100dvh; min-height: 460px; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: var(--pb); }
.mapwrap { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
button { font-family: var(--pixel); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.card { background: var(--paper); border: 3px solid var(--edge); border-radius: 10px; box-shadow: inset 0 0 0 2px var(--paper-2), 0 3px 0 #1E140C; }
.top { position: relative; display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
.top .name { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }
.top .name b { display: block; font-size: 18px; }
.top .name span { font-size: 12px; color: var(--muted); }
.flv { display: inline-block; margin-right: 5px; padding: 0 5px; border-radius: 5px; background: var(--leaf-ink); color: #FFF8E8; font: 700 11px var(--pixel); font-style: normal; line-height: 15px; }
.flvbar { position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px; background: rgba(0, 0, 0, 0.08); overflow: hidden; pointer-events: none; }
.flvbar i { display: block; height: 100%; background: var(--leaf); }
.arrow.evt { background: #F2C04A; box-shadow: 0 0 0 2px #E8602A; }
.arrow { width: 38px; height: 38px; border: 2px solid var(--edge); border-radius: 8px; background: var(--paper-2); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 5px; color: #fff; white-space: nowrap; }
.stage { --sw: min(100cqw, 100cqh * var(--ar) / 0.6); position: relative; width: var(--sw); height: min(100cqh, var(--sw) / (var(--ar))); border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 3px #1E140C; background: #5E7A2C; }   /* the map fills the column like the bars above and below it; a scene taller than the room scrolls (no more than 40% of it out of view, even on a phone held sideways) */
.scroller { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.scroller canvas { display: block; width: 100%; height: auto; aspect-ratio: var(--ar); image-rendering: pixelated; cursor: pointer; touch-action: pan-y; }
.mfade { position: absolute; left: 0; right: 0; height: 16px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }   /* more map this way */
.mfade.t { top: 0; background: linear-gradient(rgba(30,20,12,0.45), transparent); }
.mfade.b { bottom: 0; background: linear-gradient(transparent, rgba(30,20,12,0.45)); }
.mfade.on { opacity: 1; }
.hud-l { position: absolute; left: 6px; top: 6px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.sound { position: absolute; left: 6px; bottom: calc(6px + var(--gh, 0px)); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: rgba(62,42,28,0.8); color: #FFF4DE; cursor: pointer; }
.sound[aria-pressed="false"] { color: #B89A7A; }
.sound[aria-pressed="false"] #sfxWaves { display: none; }
.sound.music { left: 46px; }
.sound.gear { left: 86px; }
.pnext { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .pnext > span { font-size: 18px; color: var(--muted); }
.sound .slash { display: none; }
.sound[aria-pressed="false"] .slash { display: inline; }
.hud-r { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
.hearts { display: flex; gap: 1px; flex-wrap: wrap; max-width: 150px; }
.pill { display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 10px; background: rgba(62,42,28,0.8); color: #FFF4DE; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
#hudLevel { flex-direction: column; align-items: stretch; gap: 2px; padding-bottom: 4px; }   /* level, know-how and the bar to the next level, in one pill */
#hudLevel .lvrow { display: flex; align-items: center; gap: 5px; }
#hudLevel .lvbar { height: 4px; margin-left: 3px; border-radius: 2px; background: rgba(255,244,222,0.22); overflow: hidden; }
#hudLevel .lvbar i { display: block; height: 100%; border-radius: 2px; background: #A8D068; transition: width 0.4s; }
#hudLevel .lvbar.ready i { background: #F2C04A; }
.pill img, .ic { width: 16px; height: 16px; image-rendering: pixelated; vertical-align: -3px; }
.pill.go { pointer-events: auto; cursor: pointer; }   /* the HUD's numbers are shortcuts to where they're spent */
.clock { display: flex; align-items: center; gap: 5px; }
.clockbox { background: var(--paper); border: 3px solid var(--edge); border-radius: 8px; overflow: hidden; text-align: center; box-shadow: 0 2px 0 var(--ink); }
.clockbox .sky { height: 16px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--edge); }
.clockbox .sky i { width: 9px; height: 9px; border-radius: 5px; display: block; }
.clockbox b { font-size: 15px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.day { width: 38px; height: 38px; border-radius: 19px; background: var(--paper); border: 3px solid var(--edge); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 2px 0 var(--ink); }
.day small { font-size: 8px; color: var(--muted); font-weight: 600; } .day b { font-size: 16px; }
.crackgo { top: 96px; background: linear-gradient(#FFD8A8, #E8803A); border-color: #8A3E14; }
.goldgo { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); padding: 6px 12px; background: linear-gradient(#FFF4B0, #F2C04A); border: 3px solid #A87818; border-radius: 10px; font: 700 14px var(--pixel); color: var(--ink); cursor: pointer; box-shadow: 0 2px 0 #7A5A10; white-space: nowrap; }
.nb-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px dashed var(--paper-2); font-size: 14px; }
.nb-row select { font: inherit; padding: 3px 6px; border: 2px solid var(--edge); border-radius: 6px; background: var(--paper); color: var(--ink); max-width: 60%; }
.n { font-family: var(--body); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; font-size: 1.1em; line-height: 1; }
b .n, h2 .n, h3 .n, .row .grow b .n, .tile b .n { color: inherit; font-size: 1.1em; }
.note .n, .grow span .n, .tile span .n, .btn small .n, .pill .n, .toast .n, .goldgo .n, .stats .n, .rack small .n, .nb-row .n { font-size: 1em; }
.pill, .toast, .goldgo, .btn small, .stats b, .stats small, .fit, .want, .tile .tags > span { font-family: var(--body); font-weight: 700; font-variant-numeric: tabular-nums; }
.pc-num .n, .lvl-badge .n { font-family: inherit; }
.estate { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; margin: 6px 0; border: 2px solid #C8A060; border-radius: 8px; background: #FBF0D8; }
.es-top { display: flex; gap: 10px; align-items: center; }
.es-top > div { display: flex; flex-direction: column; gap: 2px; }
.es-pic { width: 84px; height: 84px; image-rendering: pixelated; border-radius: 6px; border: 2px solid #C8A060; flex: none; }
.es-tease .es-pic { width: 52px; height: 52px; filter: grayscale(1) brightness(0.75); opacity: 0.7; }   /* the finished estate, still in shadow */
.es-st { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.es-st li { color: var(--muted); } .es-st li .es-d { margin-top: 1px; } .es-st li.done { color: var(--ink); } .es-st li.done b::after { content: ' ✓'; color: #2D6A46; } .es-st li.next { color: var(--ink); }
.fit.gold { background: #F2C04A; color: #3A2418; }
.help { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.help.short { flex-direction: row; align-items: center; gap: 8px; }
.help.short .note { margin: 0; }
.help-ok, .linkbtn { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; }
.help-i { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--paper-2); background: #FBF4E2; color: var(--muted); font: 700 11px/1 serif; font-style: italic; cursor: pointer; }
.practice { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; margin: 6px 0; border: 2px dashed #C8A060; border-radius: 8px; background: #FFF8E6; }
.pr-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; } .pr-row .btn { padding: 4px 8px; }
.visit { display: flex; flex-direction: column; gap: 8px; }
.visit-pic { width: 100%; max-width: 384px; align-self: center; image-rendering: pixelated; border-radius: 8px; border: 2px solid var(--edge); }
.visit-stage { position: relative; width: 100%; max-width: 384px; align-self: center; display: flex; }
.visit-fx { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); image-rendering: pixelated; pointer-events: none; border-radius: 6px; }
.trow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.trow .tro { width: 21px; height: 27px; image-rendering: pixelated; }
.visit-farms { flex-wrap: wrap; }
.stickers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stickers .btn { padding: 4px 2px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.stickers .btn img { width: 22px; height: 22px; image-rendering: pixelated; object-fit: contain; }
.feed { display: flex; flex-direction: column; gap: 4px; font-size: 13px; } .feed > span { display: flex; align-items: center; gap: 6px; } .feed img { width: 18px; height: 18px; image-rendering: pixelated; object-fit: contain; }
.tiers { display: flex; flex-wrap: wrap; gap: 6px; } .tiers .chip.got { opacity: 0.6; }
.done { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 0 2px; border-top: 2px dashed var(--paper-2); }
.done > b { font-size: 12px; color: var(--leaf-ink); margin-right: 2px; }
.done.own { border-top: 0; border-bottom: 2px dashed var(--paper-2); padding: 0 0 8px; margin-bottom: 8px; }
.done.own + .row { border-top: 0; padding-top: 0; }
.done > small { flex-basis: 100%; font-family: var(--body); font-size: 11px; color: var(--muted); }
.dchip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px 2px 4px; border-radius: 99px; background: #E6F0E4; border: 1px solid #B8D4B8; color: #2D5A3C; font: 600 11px var(--pixel); line-height: 16px; }
button.dchip { cursor: pointer; }
.dchip img { width: 16px !important; height: 16px !important; image-rendering: pixelated; object-fit: contain; }
.dchip[aria-pressed="true"] { background: #2D6A46; border-color: #1F4E33; color: #FFF; }
.dchip[aria-pressed="true"]::after { content: '✓'; margin-left: 1px; }
.dchip.off { background: var(--paper); border-style: dashed; color: var(--muted); }
.dchip.off img { opacity: 0.45; }
.dtab { width: 100%; font-size: 13px; border-collapse: collapse; } .dtab td { padding: 3px 4px; border-bottom: 1px dashed var(--edge); } .dtab tr.you td { font-weight: 700; }
.roastbar { position: relative; width: 100%; align-self: stretch; box-sizing: border-box; height: 26px; border: 3px solid var(--edge); border-radius: 8px; background: #3E2A1C; overflow: hidden; margin: 10px 0; }
.roastbar .win { position: absolute; top: 0; bottom: 0; background: #F2C04A; opacity: 0.85; }
.roastbar .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; background: #FFF4DE; box-shadow: 0 0 0 1px #3E2A1C; }
.coe-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } .coe-pick .btn { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; } .coe-pick img { width: 30px; height: 30px; image-rendering: pixelated; object-fit: contain; }
.visit-btn { grid-column: 1 / -1; justify-self: end; margin-top: 2px; font: inherit; font-size: 11px; padding: 2px 10px; border-radius: 99px; border: 2px solid var(--edge); background: #FBF4E2; cursor: pointer; }
.code { letter-spacing: 0.12em; }
.lcode { margin: 0; padding: 6px 14px; border: 2px dashed #E8B830; border-radius: 8px; background: #FFF6D8; font: 700 26px var(--pixel); letter-spacing: 0.12em; user-select: all; -webkit-user-select: all; }
.lcode.small { font: 700 12px var(--body); letter-spacing: 0; word-break: break-all; }
.codein { width: 100%; font: 700 18px var(--pixel); padding: 8px; border: 2px solid var(--edge); border-radius: 8px; text-align: center; letter-spacing: 0.08em; background: #FFFDF6; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.chip { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: #E6F0E4; color: #2D5A3C; border: 1px solid #B8D4B8; }
.buyline { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; margin: 6px 0; border: 2px solid var(--paper-2); border-radius: 8px; background: #FBF4E2; cursor: pointer; font: inherit; color: inherit; }
.buyline > span { display: flex; flex-direction: column; } .buyline small { color: var(--muted); }
.ccard.boat { border-color: #2E7FA8; background: #E8F4FA; }
.stamps img.gold { outline: 3px solid #E8B830; outline-offset: 1px; border-radius: 50%; box-shadow: 0 0 8px #F2C04A; }
.req { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; margin: 8px 0; border: 2px solid #A87818; border-radius: 8px; background: #FFF6D8; }
.req > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.req b { font-size: 14px; } .req > div > span:not(.note) { font-family: var(--body); font-size: 13px; font-weight: 700; color: #5A4630; }
.nbw { overflow-x: auto; border: 2px solid var(--paper-2); border-radius: 8px; background: #FBF4E2; }
.nb { border-collapse: collapse; width: 100%; font-size: 11px; }
.nb th, .nb td { padding: 4px 3px; text-align: center; border-bottom: 1px dashed var(--paper-2); vertical-align: middle; }
.nb th small, .nb td small { display: block; font-family: var(--body); font-size: 9px; color: var(--muted); line-height: 1.1; }
.nb tbody th { text-align: left; white-space: nowrap; } .nb tbody th img { vertical-align: middle; }
.nb tbody th small { display: inline; font-size: 10px; margin-left: 3px; color: var(--ink); }
.nb td b { color: #A87818; font-size: 12px; letter-spacing: -1px; }
.nb td.off b { color: #C8BCA4; } .nb td.full { background: #FFF1C4; } .nb td.asked { box-shadow: inset 0 0 0 2px #E8B830; background: #FFF6D8; }
.rrow { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 2px dashed var(--paper-2); }
.rrow-t { display: flex; gap: 8px; align-items: center; } .rrow-t > div { display: flex; flex-direction: column; min-width: 0; }
.rrow-t b { font-size: 14px; } .rrow-t span { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--muted); }
.rrow .seg .btn { flex: 1 1 0; min-width: 0; }
.roasters { display: flex; flex-direction: column; gap: 6px; }
.rslot { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 2px solid var(--paper-2); border-radius: 8px; background: #FBF4E2; }
.rslot > div { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rslot .bar { position: relative; } .rslot .cz { position: absolute; left: 70%; top: 0; bottom: 0; background: rgba(242,192,74,0.55); border-left: 1px solid #A87818; border-right: 1px solid #A87818; }   /* the first-crack window */
.rslot b { font-size: 13px; } .rslot small { font-family: var(--body); font-size: 11px; font-weight: 700; color: var(--muted); }
.rslot.idle span { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--muted); }
.rslot.crack { border-color: #E8602A; background: #FFF0E0; animation: crackpulse 0.5s infinite alternate; }
@keyframes crackpulse { to { box-shadow: 0 0 0 3px #F2C04A; } }
@media (prefers-reduced-motion: reduce) { .rslot.crack { animation: none; } }
/* notices show inside the farm-name banner, between its arrows, so they never cover the map or a menu */
.toast { position: absolute; z-index: 3; left: 50px; right: 50px; top: 4px; min-height: calc(100% - 8px); display: flex; align-items: center; justify-content: center; padding: 4px 8px; background: #FFF6D8; border: 2px solid #E8B830; border-radius: 8px; font-size: 13px; line-height: 1.25; text-align: center; color: var(--ink); pointer-events: none; }
.toast[hidden] { display: none; }
.toast.long { font-size: 11.5px; }
.toast.pop { animation: toastin 0.22s ease-out; }
@keyframes toastin { from { opacity: 0; transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .toast.pop { animation: none; } }
.tabs { position: relative; z-index: 11; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
/* every tab opens the same way: a sheet from the middle of the screen down to the tabs, its own page scrolling inside. Tap the tab again to put it away */
.sheet { position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% - var(--sh)); transition: top 0.22s ease-out; bottom: var(--dock); display: flex; flex-direction: column; overflow: hidden; box-shadow: inset 0 0 0 2px var(--paper-2), 0 -4px 14px rgba(20,12,6,0.45), 0 3px 0 #1E140C; animation: sheetup 0.18s ease-out; }
.sheet[hidden] { display: none; }
/* scroll a sheet and it grows to fill everything below the farm bar; pull it down (or drag its handle) to go back to half */
.app.full .sheet { top: var(--ft, 80px); }
.sheet.drag { transition: none; }
@keyframes sheetup { from { transform: translateY(36px); opacity: 0; } }
.sheet-h { position: relative; flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 6px 4px 10px; border-bottom: 2px solid var(--paper-2); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.sheet-h::before { content: ''; position: absolute; top: 4px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: #C8B48C; }   /* the grab handle */
.sheet-h img { width: 18px; height: 18px; image-rendering: pixelated; }
.sheet-h b { flex: 1; min-width: 0; font-size: 15px; }
.sheet-x { width: 32px; height: 28px; border: 2px solid var(--edge); border-radius: 8px; background: var(--paper-2); color: var(--ink); font: 700 14px var(--pixel); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; transition: none; } }
.tab { height: 46px; border: 3px solid var(--edge); border-radius: 8px; background: var(--paper-2); color: var(--ink); font-size: 10.5px; letter-spacing: -0.02em; padding: 0 1px; min-width: 0; overflow: hidden; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
.tab[aria-pressed="true"] { background: var(--gold); }
.tab img { width: 18px; height: 18px; image-rendering: pixelated; }
.tab .dot { position: absolute; top: 3px; right: 4px; width: 8px; height: 8px; border-radius: 4px; background: var(--cherry); border: 1px solid var(--ink); }
.panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-size: 18px; font-weight: 700; }
.panel h3 { margin: 0; font-size: 15px; font-weight: 700; }
.note { font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.45; margin: 0; }
.bar { height: 12px; border: 2px solid var(--edge); border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--leaf); box-shadow: inset 0 2px 0 #A8C860; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 2px dashed var(--paper-2); }
.row:first-of-type { border-top: 0; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .grow b { font-size: 15px; }
