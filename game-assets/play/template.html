<style>
/* One cozy world: a dark-wood frame around the farm, parchment panels, pixel type for game labels */
:root {
  --wood: #3A2A1C; --wood-2: #4E3826; --ink: #3E2A1C; --muted: #7A5A3A; --paper: #F4E6C6; --paper-2: #E8D4A8;
  --edge: #6E4624; --gold: #F2C04A; --leaf: #8CB04A; --leaf-ink: #5E7E2C; --cherry: #D84A36; --sky: #7EC8F0; --off: #D8C8A8;
  --pixel: 'Pixelify Sans', ui-monospace, monospace; --body: 'Zen Kaku Gothic New', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--wood); }
body { color: var(--ink); font-family: var(--pixel); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; }
.app { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
button { font-family: var(--pixel); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.card { background: var(--paper); border: 3px solid var(--edge); border-radius: 10px; box-shadow: inset 0 0 0 2px var(--paper-2), 0 3px 0 #1E140C; }
.top { display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
.top .name { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }
.top .name b { display: block; font-size: 18px; }
.top .name span { font-size: 12px; color: var(--muted); }
.arrow { width: 38px; height: 38px; border: 2px solid var(--edge); border-radius: 8px; background: var(--paper-2); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 5px; color: #fff; white-space: nowrap; }
.stage { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 3px #1E140C; background: #5E7A2C; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; }
.hud-l { position: absolute; left: 6px; top: 6px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.sound { position: absolute; left: 6px; bottom: 6px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: rgba(62,42,28,0.8); color: #FFF4DE; cursor: pointer; }
.sound[aria-pressed="false"] { color: #B89A7A; }
.sound[aria-pressed="false"] #sfxWaves { display: none; }
.sound.music { left: 46px; }
.sound .slash { display: none; }
.sound[aria-pressed="false"] .slash { display: inline; }
.hud-r { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
.hearts { display: flex; gap: 1px; flex-wrap: wrap; max-width: 150px; }
.pill { display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 10px; background: rgba(62,42,28,0.8); color: #FFF4DE; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill img, .ic { width: 16px; height: 16px; image-rendering: pixelated; vertical-align: -3px; }
.clock { display: flex; align-items: center; gap: 5px; }
.clockbox { background: var(--paper); border: 3px solid var(--edge); border-radius: 8px; overflow: hidden; text-align: center; box-shadow: 0 2px 0 var(--ink); }
.clockbox .sky { height: 16px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--edge); }
.clockbox .sky i { width: 9px; height: 9px; border-radius: 5px; display: block; }
.clockbox b { font-size: 15px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.day { width: 38px; height: 38px; border-radius: 19px; background: var(--paper); border: 3px solid var(--edge); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 2px 0 var(--ink); }
.day small { font-size: 8px; color: var(--muted); font-weight: 600; } .day b { font-size: 16px; }
.toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: 92%; padding: 8px 12px; background: var(--paper); border: 3px solid var(--edge); border-radius: 10px; font-size: 15px; text-align: center; box-shadow: 0 3px 0 #1E140C; pointer-events: none; }
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.tab { height: 46px; border: 3px solid var(--edge); border-radius: 8px; background: var(--paper-2); color: var(--ink); font-size: 10.5px; letter-spacing: -0.02em; padding: 0 1px; min-width: 0; overflow: hidden; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
.tab[aria-pressed="true"] { background: var(--gold); }
.tab img { width: 18px; height: 18px; image-rendering: pixelated; }
.tab .dot { position: absolute; top: 3px; right: 4px; width: 8px; height: 8px; border-radius: 4px; background: var(--cherry); border: 1px solid var(--ink); }
.panel { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-size: 18px; font-weight: 700; }
.panel h3 { margin: 0; font-size: 15px; font-weight: 700; }
.note { font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.45; margin: 0; }
.bar { height: 12px; border: 2px solid var(--edge); border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--leaf); box-shadow: inset 0 2px 0 #A8C860; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 2px dashed var(--paper-2); }
.row:first-of-type { border-top: 0; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .grow b { font-size: 15px; }
.row .grow span { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.35; }
.art { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; background: var(--paper-2); border: 2px solid var(--edge); border-radius: 6px; overflow: hidden; }
.art img { image-rendering: pixelated; max-width: 44px; max-height: 44px; }
.btn { min-width: 76px; min-height: 44px; padding: 4px 10px; border: 3px solid var(--edge); border-radius: 8px; background: var(--gold); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn small { font-size: 11px; font-weight: 600; }
.btn.green { background: #9CC860; } .btn.blue { background: #9CCCF0; }
.btn:disabled { background: var(--off); color: #8A7458; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(2px); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { border: 2px solid var(--edge); border-radius: 8px; background: #FBF1DC; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.tile[aria-pressed="true"] { background: #FFE9B0; box-shadow: 0 0 0 2px var(--cherry); }
.tile b { font-size: 14px; } .tile span { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--muted); }
.stamps { display: flex; gap: 6px; flex-wrap: wrap; }
.stamps img { width: 40px; height: 40px; image-rendering: pixelated; }
.stamps .off { opacity: 0.25; filter: grayscale(1); }
.modal { position: fixed; inset: 0; background: rgba(20,12,6,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal[hidden] { display: none; }
.hn { font-size: 12px; color: #FFF4DE; margin-left: 3px; text-shadow: 1px 1px 0 #3E2A1C; }
.guide { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #2D6A46; color: #FBF1DC; border: 3px solid #1E4A30; border-radius: 10px; font-weight: 700; font-size: 13px; }
.guide[hidden] { display: none; }
.gstep { font: 700 12px 'Pixelify Sans', monospace; background: #F2C04A; color: #3E2A1C; border-radius: 6px; padding: 1px 6px; flex: none; }
.gtext { flex: 1; min-width: 0; }
.gskip { border: 0; background: transparent; color: #CDE8D6; font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; flex: none; }
.hint { outline: 3px solid #F2C04A !important; outline-offset: 2px; animation: hint 1s ease-in-out infinite; position: relative; z-index: 3; }
@keyframes hint { 50% { outline-color: #FFF4C0; transform: translateY(-2px); } }
canvas.hint { transform: none !important; }
.tab.fresh { animation: hint 1s ease-in-out 4; }
.market { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: #FFF1C4; border: 2px solid #C98F12; border-radius: 8px; font-size: 13px; }
.streak { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; width: 100%; }
.streak span { display: flex; flex-direction: column; align-items: center; padding: 4px 2px; border: 2px solid #D9C29A; border-radius: 6px; font-size: 9px; font-weight: 700; color: #7A5A3A; line-height: 1.2; text-align: center; }
.streak span b { font-size: 13px; color: #3E2A1C; }
.streak span.done { background: #E2F0E6; border-color: #2D6A46; }
.streak span.now { background: #F2C04A; border-color: #A87818; }
@media (prefers-reduced-motion: reduce) { .hint, .tab.fresh { animation: none; } }
.plate { display: inline-block; padding: 2px 8px; border: 2px solid; border-radius: 6px; font: 700 13px var(--pixel, 'Pixelify Sans'), monospace; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.p-seed { background: #EEE2C6; color: #5A4630; border-color: #B89A6A; }
.p-bronze { background: linear-gradient(#ECAE72, #B06A34); color: #3A1E0C; border-color: #7A4420; }
.p-silver { background: linear-gradient(#F6F8FA, #B4BCC6); color: #262C34; border-color: #7A8490; }
.p-gold { background: linear-gradient(110deg, #F2C84A 0%, #FFF4B0 42%, #E8B830 58%, #F2C84A 100%); background-size: 260% 100%; animation: shine 3.2s linear infinite; color: #4A3208; border-color: #A87818; }
.p-jade { background: linear-gradient(#8ED8B4, #2E8A64); color: #06261A; border-color: #1E6A48; box-shadow: 0 0 6px rgba(126,208,168,0.8); }
.p-sakura { background: radial-gradient(circle at 20% 30%, #FFF 0 1.5px, transparent 2px), radial-gradient(circle at 70% 70%, #FFF 0 1.5px, transparent 2px), linear-gradient(#FFE4EE, #F0A0BC); color: #6A1E3A; border-color: #C86C8E; }
.p-ember { background: linear-gradient(#2E2428, #14100E); color: #FFB070; border-color: #E8602A; animation: ember 1.6s ease-in-out infinite alternate; }
.p-crane { background: linear-gradient(110deg, #FFF6D0, #F2C04A, #FFFFFF, #F2C04A, #FFF6D0); background-size: 300% 100%; animation: shine 2.4s linear infinite; color: #4A3208; border-color: #E8B830; box-shadow: 0 0 10px rgba(242,192,74,0.75); }
.fr { position: relative; display: inline-grid; place-items: center; flex: none; border-radius: 12px; background: #FBF1DC; border: 3px solid var(--edge); overflow: hidden; }
.fr img { image-rendering: pixelated; position: relative; z-index: 1; }
.b-bronze { border-color: #B06A34; box-shadow: inset 0 0 0 2px #ECAE72; }
.b-silver { border-color: #8A949E; box-shadow: inset 0 0 0 2px #F6F8FA, 0 0 0 2px #C8D0D8; }
.b-gold { border-color: #E8B830; box-shadow: inset 0 0 0 2px #FFF4B0; }
.b-gold::before, .b-crane::before { content: ''; position: absolute; inset: -40%; background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.75) 50%, transparent 60%); animation: sweep 2.6s linear infinite; }
.b-jade { border-color: #2E8A64; animation: pulse 2s ease-in-out infinite; }
.b-sakura { border-color: #E68EAC; background: #FFF0F5; }
.b-sakura::before, .b-sakura::after { content: ''; position: absolute; width: 4px; height: 3px; background: #F2A0BC; top: -6px; left: 20%; animation: petal 3s linear infinite; }
.b-sakura::after { left: 65%; animation-delay: 1.4s; }
.b-ember { border-color: #E8602A; background: #2A2024; animation: ember 1.4s ease-in-out infinite alternate; }
.b-crane { border-color: #F2C04A; background: #FFF8E0; box-shadow: 0 0 10px rgba(242,192,74,0.9), inset 0 0 0 2px #FFFFFF; }
@keyframes shine { to { background-position: -260% 0; } }
@keyframes sweep { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
@keyframes pulse { 50% { box-shadow: 0 0 10px rgba(126,208,168,0.95); } }
@keyframes ember { from { box-shadow: 0 0 4px rgba(232,96,42,0.5); } to { box-shadow: 0 0 12px rgba(255,140,60,0.95); } }
@keyframes petal { from { transform: translate(0, 0) rotate(0); } to { transform: translate(8px, 72px) rotate(200deg); } }
@media (prefers-reduced-motion: reduce) { .plate, .fr, .fr::before, .fr::after { animation: none !important; } }
.me { display: flex; gap: 12px; align-items: center; }
.me-t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.looks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.look { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border: 2px solid var(--edge); border-radius: 8px; background: var(--paper-2); cursor: pointer; min-width: 0; font: inherit; color: var(--ink); }

.lb { display: flex; flex-direction: column; gap: 5px; }
.lb-row { display: grid; grid-template-columns: 24px 44px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 8px; border: 2px solid var(--edge); border-radius: 8px; background: var(--paper-2); }

.lb-row .rk { text-align: center; font-size: 15px; }
.lb-n { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lb-s { display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.lb-s b { font-size: 14px; color: var(--ink); }
#nameIn { flex: 1; min-width: 0; min-height: 36px; border: 2px solid var(--edge); border-radius: 6px; padding: 0 8px; font: 600 15px inherit; background: #FFFDF6; color: var(--ink); }
.subtabs { position: sticky; top: 0; z-index: 2; }

.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #D8302C; vertical-align: middle; margin-left: 2px; }

.stats div { background: #FBF1DC; border: 2px solid var(--paper-2); border-radius: 6px; padding: 6px 2px; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.stats small { font-size: 11px; color: var(--muted); }
.stats b { font-size: 17px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { min-height: 36px; padding: 0 10px; border: 2px solid var(--edge); border-radius: 6px; background: var(--paper-2); font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink); }

.level { display: flex; align-items: center; gap: 8px; }

.level .bar { flex: 1; }
@media (prefers-reduced-motion: reduce) { .btn:active:not(:disabled) { transform: none; } }
</style>

  else if (a === 'shoptab') S.shopTab = v;
  else if (a === 'build') { const n = f.build[v] || 0; if (n < 3 && spend('coins', buildCost(S.loc, v))) { f.build[v] = n + 1; toast(ART.buildings[v].name + (n ? ' upgraded to level ' + (n + 1) : ' built')); } }
  else if (a === 'mgr') { if (!f.manager && spend('coins', MANAGER_COST(S.loc))) { f.manager = { x: 150, y: 94, tx: 150, ty: 94, t: 0, walk: 0, dir: 'down' }; toast('Your manager takes over at ' + ART.locations[S.loc].name.split(',')[0]); } }
  else if (a === 'foreman') { if (!S.staff.foreman && spend('coins', FOREMAN_COST)) { S.staff.foreman = true; toast('The mill foreman starts work'); } }
  else if (a === 'agent') { if (S.staff.foreman && !S.staff.agent && spend('coins', AGENT_COST)) { S.staff.agent = true; toast('The contracts agent joins the mill'); } }
  else if (a === 'rule') S.staff.rule = v;
  else if (a === 'skip') { S.contracts = S.contracts.filter((c) => String(c.id) !== v); S.nextContract = Math.max(S.nextContract, S.minutesTotal + 20); toast('Contract skipped. A new one comes soon.'); }
  else if (a === 'deliver') { const [i, id] = v.split('.'); deliver(+i, +id); }
  else if (a === 'decor') { if (S.decor[v] !== undefined) S.decor[v] = !S.decor[v]; else if (spend('coins', DECOR[v].cost)) { S.decor[v] = true; toast(DECOR[v].name + ' added to your farms'); } }
  else if (a === 'go') { S.loc = v; setTab('farm'); }
  else if (a === 'bed') {
    const b = +v, cur = f.beds[b];
    showModal('<h2>Replant field ' + (b + 1) + '</h2><p class="note">Now growing ' + ART.varieties[cur] + '. Replanting starts the field again from sprouts.</p>' + VAR_ORDER.filter((x) => S.vars[x]).map((x) => row(img('bush_' + x + '_ripe', 30), ART.varieties[x] + (ART.locations[f.loc].beds.includes(x) ? ' · native' : ''), VAR[x].kg + ' kg a pick · ×' + VAR[x].value + ' price', btn(x === cur ? 'Growing' : 'Plant', '', 'plant:' + b + '.' + x, x !== cur, 'green'))).join('') + '<button class="btn" data-act="close">Cancel</button>');
    return;
  }
  else if (a === 'plant') { const [b, x] = v.split('.'); if (S.vars[x]) { replantBed(f, +b, x); $('modal').hidden = true; toast('Field ' + (+b + 1) + ' planted with ' + ART.varieties[x]); } }
  else if (a === 'var') { const nx = VAR_ORDER.find((x) => !S.vars[x]); if (v === nx && spend('points', VAR[v].cost)) { S.vars[v] = true; showModal('<h2>' + ART.varieties[v] + ' unlocked</h2>' + img('bush_' + v + '_ripe', 54) + '<p class="note">' + VAR[v].perk + ' Replant a field in the Farm tab to start growing it.</p><button class="btn green" data-act="close">Plant it</button>'); } }
  else if (a === 'task') { const tk = S.tasks[+v]; if (tk.have >= tk.goal && !tk.done) { tk.done = true; earn(tk.reward); toast('Task complete!'); } }
  else if (a === 'weekly') { S.weekly.claimed = true; S.cranes += 30; showModal('<h2>Order delivered!</h2><p class="note">The team delivered ' + fmt(S.weekly.target) + ' kg of washed coffee to the roastery. +30 cranes and the Co-op Roaster badge.</p><button class="btn green" data-act="close">Hooray</button>'); }
  else if (a === 'prestigeAsk') {
    const asleep = LOCS.filter((l) => FARM_LEVEL[l] && S.farms[l].unlocked);
    showModal('<h2>Prestige ' + (S.prestige + 1) + '?</h2><p class="note"><b>You keep</b> coins, cranes, every upgrade, building, manager, variety, process, decoration, hat and look.</p><p class="note"><b>You lose</b> your level and ' + fmt(S.points) + ' unspent know-how' + (asleep.length ? ', and ' + asleep.map((l) => ART.locations[l].name.split(',')[0]).join(', ') + (asleep.length > 1 ? ' go' : ' goes') + ' dormant until you level back up' : '') + '.</p><p class="note">You gain ' + (S.prestige + 1 < TIERS.length ? 'the ' + TIERS[S.prestige + 1] + ' nameplate, border and ' + SKINS[S.prestige + 1].name + ' outfit' : 'a star on your name') + ', and you jump above everyone on prestige ' + S.prestige + '.</p>' + btn('Prestige now', '', 'prestige', true, 'green') + '<button class="btn" data-act="close">Not yet</button>');
    return;
  }
  else if (a === 'prestige') { $('modal').hidden = true; prestige(); SFX.play('levelup'); SFX.play('achieve'); }
  else if (a === 'look') { const [k, i] = v.split('.'); if (+i <= tierOf(S.prestige)) S.look[k] = +i; }
  else if (a === 'rename') { const nv = ($('nameIn').value || '').trim().slice(0, 16); if (nv) { S.name = nv; toast('Name saved'); } }
  else if (a === 'boost') {
    const cost = { grow: 5, pick: 5, hearts: 2, points: 10, dry: 6 }[v];
    if (!spend('cranes', cost)) return;
    if (v === 'grow' || v === 'pick') S.boosts[v] = Math.max(S.boosts[v] || 0, S.minutesTotal) + 30;
    if (v === 'hearts') S.hearts = maxHearts();
    if (v === 'points') earn({ points: 500 });
    if (v === 'dry') S.lots.forEach((l) => { l.left = 0; });
    toast('Boost used');
  }
  else if (a === 'buyhat') { const cost = { beju: 15, sakura: 20, indigo: 15, harvest: 20 }[v]; if (spend('cranes', cost)) { S.hats[v] = true; S.hat = v; } }
  else if (a === 'hat') S.hat = v;
  else if (a === 'order') realOrder(v);
  else if (a === 'add') {
    if (v === 'coins') S.coins += 1000; if (v === 'bigcoins') S.coins += 25000; if (v === 'checkin') { const y = new Date(Date.now() - 86400000); S.checkin.last = dayKey(y); checkIn(); } if (v === 'guide') { S.guide = 0; S.guideN = 0; } if (v === 'contracts') { S.contracts = []; for (let k = 0; k < contractSlots(); k++) S.contracts.push(newContract()); } if (v === 'points') earn({ points: 2000 }); if (v === 'cranes') S.cranes += 50; if (v === 'vars') VAR_ORDER.forEach((x) => { S.vars[x] = true; });
    if (v === 'xp') { S.xp = XP_AT(level() + 1); wakeFarms(); }
    if (v === 'cherries') { const vv = S.farms[S.loc].beds[0]; S.cherries[vv] = (S.cherries[vv] || 0) + (cap() - stored()); }
  }
  else if (a === 'away') away(+v);
  else if (a === 'day') { S.minutes = 1439.9; }
  else if (a === 'speed') S.speed = +v;
  else if (a === 'mvol') { S.musicVol = +v; syncMusic(); }
  else if (a === 'season') S.seasonPick = v;
  else if (a === 'reset') { if (b.dataset.sure) { try { localStorage.removeItem(SAVE_KEY); } catch (er) { /* nothing saved */ } S = fresh(); LOCS.forEach((l) => plant(S.farms[l])); addWorker(S.farms[START]); addWorker(S.farms[START]); newTasks(); toast('New game started'); } else { b.dataset.sure = '1'; b.textContent = 'Tap again to reset'; return; } }
  refreshAll();
});

function refreshHud() {
  const L = ART.locations[S.loc], sea = season(S.loc);
  $('locName').textContent = L.name;
  const fb = S.farms[S.loc].beds.slice(0, S.farms[S.loc].field ? 4 : 3);
  $('locBeds').textContent = S.farms[S.loc].unlocked ? fb.filter((v, i) => fb.indexOf(v) === i).map((v) => ART.varieties[v]).join(' · ') : 'Native: ' + L.beds.filter((v, i) => L.beds.indexOf(v) === i).map((v) => ART.varieties[v]).join(' · ');
  const SEA = { harvest: ['Harvest ×1.5', '#D85A3A'], rainy: ['Rainy · flowering', '#4A8AB8'], spring: ['Spring', '#E688A8'], summer: ['Summer ×1.25', '#6CA442'], autumn: ['Autumn', '#D2702C'], winter: ['Winter ×0.5', '#8CA8C8'] }[sea];
  $('seasonChip').textContent = SEA[0]; $('seasonChip').style.background = SEA[1];
  const mh = maxHearts();
  const hshow = Math.min(mh, 10);   /* ten hearts drawn, the rest as a number */
  $('hearts').innerHTML = Array.from({ length: hshow }, (_, i) => '<svg width="14" height="12" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true" style="filter:drop-shadow(1px 1px 0 #3E2A1C)"><g fill="' + (i < Math.ceil(S.hearts / mh * hshow) ? '#F07A3A' : '#5A3A2C') + '"><rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/><rect x="0" y="1" width="7" height="2"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/></g></svg>').join('') + '<b class="hn">' + S.hearts + '</b>';
  $('hearts').setAttribute('aria-label', S.hearts + ' of ' + mh + ' hearts');
  $('hudLevel').innerHTML = icon('i_points') + 'Lv ' + level() + ' · ' + fmt(S.points);
  $('hudCoins').innerHTML = icon('i_coin') + fmt(S.coins);
  $('hudCranes').innerHTML = icon('i_crane') + S.cranes;
  const full = stored() >= cap();
  $('hudStore').innerHTML = icon('i_cherry') + '<span style="color:' + (full ? '#FF9A8A' : '#FFF4DE') + '">' + fmt(stored()) + '/' + fmt(cap()) + '</span>';
  const mins = Math.floor(S.minutes), hr = mins / 60, night = hr >= 19 || hr < 6;
  $('clock').textContent = String(Math.floor(hr)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
  $('day').textContent = S.day;
  $('sky').style.background = night ? '#2C3470' : hr >= 17 ? '#F0A060' : '#7EC8F0';
  $('sun').style.background = night ? '#F4F0D0' : '#FFD84A';
}
function refreshAll() { refreshHud(); renderTabs(); renderPanel(); renderGuide(); }

/* ---------- start: offline earnings, intro, loop ---------- */
const awayMs = Date.now() - (S.last || Date.now());
refreshAll();
if (awayMs > 5 * 60 * 1000) away(Math.min(12, Math.round(awayMs / 3600000 * 10) / 10 || 0.1));
else if (S.intro === 0) showModal('<img src="' + url('worker_down_0', { shirt: ART.shirts[0] }) + '" alt="" style="width:48px;image-rendering:pixelated"><h2>Welcome to Beju Farm</h2><p class="note">Your first coffee farm, in Brazil. Follow the goal under the farm to learn the basics; new tabs open as you go.</p><p class="note"><b>Coins</b> build and hire. <b>Know-how</b> unlocks new coffees, farms and processes. <b>Cranes</b> come from real Beju orders.</p><button class="btn green" data-act="close">Start farming</button>');
let last = performance.now(), uiT = 0, saveT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  tick(dt); draw(t / 1000);
  uiT += dt; saveT += dt;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
  if (uiT > 0.5) { uiT = 0; refreshHud(); syncMusic(); if ((!$('panel').matches(':hover') || tab === 'mill') && !(document.activeElement && document.activeElement.id === 'nameIn')) renderPanel(); checkTabs(); renderTabs(); renderGuide(); }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
let soundReady = false;
function audioStart() {   /* browsers only allow sound after a tap, so everything starts on the first one */
  if (soundReady) return; soundReady = true;
  setTimeout(() => { if ($('modal').hidden) { checkIn(); refreshAll(); } else { const w = setInterval(() => { if ($('modal').hidden) { clearInterval(w); checkIn(); refreshAll(); } }, 500); } }, 400);
  SFX.unlock(); Cozy.init(SFX.context()); syncMusic();
}
document.addEventListener('pointerdown', audioStart, true);
const trackFor = () => S.loc;   /* every farm plays its own theme, open or not */
function syncMusic() {
  Cozy.setVolume(S.musicVol); Cozy.setEnabled(S.music);
  const hr = S.minutes / 60; Cozy.setNight(hr >= 19 || hr < 6);
  if (soundReady && Cozy.current() !== trackFor()) Cozy.play(trackFor());
}
const BIG = new Set(['coins', 'levelup', 'achieve', 'contract', 'build', 'crane']);
SFX.onPlay = (n) => { if (BIG.has(n)) Cozy.duck(); };
function syncSound() {
  SFX.setEnabled(S.sfx); $('sfxBtn').setAttribute('aria-pressed', String(S.sfx)); $('sfxBtn').setAttribute('aria-label', S.sfx ? 'Sound effects on' : 'Sound effects off');
  $('musicBtn').setAttribute('aria-pressed', String(S.music)); $('musicBtn').setAttribute('aria-label', S.music ? 'Music on' : 'Music off');
}
$('sfxBtn').addEventListener('click', () => { S.sfx = !S.sfx; syncSound(); if (S.sfx) SFX.play('tick'); });
$('musicBtn').addEventListener('click', () => { S.music = !S.music; syncSound(); syncMusic(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) Cozy.pause(); else Cozy.resume(); });
syncSound();
window.addEventListener('pagehide', save);
})();
</script>
