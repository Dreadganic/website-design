<title>Beju Farm Theme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: a handheld-style jukebox on a dark wood ground: track list, player with a four-lane note roll, then notes on the region. One look in both themes (matches the game). */
:root {
  --wood: #3A2A1C; --wood-2: #2A1E14; --paper: #F4E6C6; --paper-2: #FBF1DC; --edge: #6E4624; --ink: #3E2A1C; --muted: #7A5A3A;
  --gold: #F2C04A; --green: #2D6A46; --lcd: #1E2A1C; --lcd-grid: #2A3A28;
  --ch1: #F2C04A; --ch2: #8CC8A8; --ch3: #E88A6A; --ch4: #B8B0D8;
  --display: 'Pixelify Sans', 'Courier New', monospace; --body: 'Zen Kaku Gothic New', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--wood); }
body { color: var(--paper); font-family: var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; }
h1 { font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1.1; margin: 4px 0 6px; text-wrap: balance; }
.sub { font-size: 14px; color: #E2C894; margin: 0; font-weight: 500; }
.card { background: var(--paper); color: var(--ink); border: 3px solid var(--edge); border-radius: 12px; box-shadow: inset 0 0 0 2px #E2C894, 0 4px 0 var(--wood-2); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.tracks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.track { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 2px solid var(--edge); border-radius: 8px; background: var(--paper-2); color: var(--ink); text-align: left; cursor: pointer; font: inherit; min-width: 0; }
.track b { font: 600 15px var(--display); }
.track span { font-size: 11px; font-weight: 700; color: var(--muted); }
.track[aria-pressed="true"] { background: var(--gold); }
.track[aria-pressed="true"] span { color: var(--ink); }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.play { width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--edge); background: var(--gold); color: var(--ink); font: 700 15px var(--display); cursor: pointer; box-shadow: 0 4px 0 var(--wood-2); flex: none; }
.play:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--wood-2); }
.play[aria-pressed="true"] { background: #F7D985; }
.stack { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
.now b { font: 600 20px var(--display); display: block; }
.now span { font-size: 12px; font-weight: 700; color: var(--muted); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; min-height: 36px; border: 2px solid var(--edge); border-radius: 6px; background: var(--paper-2); color: var(--ink); font: 600 14px var(--display); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); }
label.vol { display: flex; align-items: center; gap: 8px; font: 600 13px var(--display); color: var(--muted); }
input[type=range] { flex: 1; accent-color: var(--green); }
.lcd { background: var(--lcd); border: 3px solid var(--ink); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.lcd canvas { width: 100%; height: 168px; display: block; image-rendering: pixelated; }
.pos { display: flex; justify-content: space-between; font: 600 13px var(--display); color: #A8C8A0; font-variant-numeric: tabular-nums; }
.lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.lane { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 8px; border: 2px solid var(--edge); border-radius: 6px; background: var(--paper-2); color: var(--ink); cursor: pointer; text-align: left; font: inherit; }
.lane i { width: 12px; height: 12px; border: 2px solid var(--ink); flex: none; }
.lane b { font: 600 13px var(--display); display: block; }
.lane span { font-size: 11px; color: var(--muted); font-weight: 700; }
.lane[aria-pressed="false"] { opacity: 0.45; }
.lane[aria-pressed="false"] i { background: transparent !important; }
.map { display: flex; gap: 4px; flex-wrap: wrap; }
.map div { flex: 1; min-width: 48px; text-align: center; padding: 6px 0; border: 2px solid var(--edge); border-radius: 6px; font: 600 13px var(--display); background: var(--paper-2); color: var(--muted); }
.map div.on { background: var(--green); color: var(--paper-2); }
.hint { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.5; }
.hint span { font-family: var(--display); color: var(--green); }
h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
p { margin: 0; line-height: 1.6; font-size: 14px; max-width: 65ch; }
.notes { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; margin: 0; }
.notes dt { font: 600 13px var(--display); color: var(--muted); }
.notes dd { margin: 0; }
button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
@media (max-width: 420px) { .lanes { grid-template-columns: 1fr; } h1 { font-size: 28px; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Beju Farm · sound test</div>
    <h1>Farm Jukebox</h1>
    <p class="sub">One original theme for each farm, played live on four Game Boy channels</p>
  </header>

  <section class="card" aria-label="Tracks">
    <div class="tracks" id="tracks"></div>
  </section>

  <section class="card" aria-label="Player">
    <div class="controls">
      <button class="play" id="play" type="button" aria-pressed="false">PLAY</button>
      <div class="stack">
        <div class="now"><b id="nowTitle">Finca Morning</b><span id="nowSub"></span></div>
        <div class="seg" role="group" aria-label="Arrangement">
          <button type="button" id="day" aria-pressed="true">Day</button>
          <button type="button" id="night" aria-pressed="false">Night</button>
        </div>
        <label class="vol" for="vol">VOLUME <input id="vol" type="range" min="0" max="100" value="60"></label>
      </div>
    </div>
    <div class="lcd">
      <canvas id="roll" width="512" height="168" aria-label="Notes playing on each channel"></canvas>
      <div class="pos"><span id="where">Press play</span><span id="clock">0:00</span></div>
    </div>
    <p class="hint"><span id="astate">Audio: not started</span>. No sound on an iPhone? Flip the Ring/Silent switch to ring, turn the volume up, then press Play again.</p>
    <div class="map" id="map" aria-label="Song sections"></div>
    <div class="lanes" id="lanes"></div>
  </section>

  <section class="card">
    <h2 id="aboutTitle">About this theme</h2>
    <p id="about"></p>
    <dl class="notes" id="parts"></dl>
  </section>
</div>

function setPlayLabel() { $('play').textContent = playing ? 'STOP' : 'PLAY'; $('play').setAttribute('aria-pressed', String(playing)); }
$('play').addEventListener('click', () => { if (playing) stop(); else start(); setPlayLabel(); });
['day', 'night'].forEach((k) => $(k).addEventListener('click', () => { night = k === 'night'; $('day').setAttribute('aria-pressed', String(!night)); $('night').setAttribute('aria-pressed', String(night)); applyMix(); showSong(); }));
$('vol').addEventListener('input', () => { if (ac && playing) master.gain.setTargetAtTime(+$('vol').value / 100, ac.currentTime, 0.05); });
showSong();

const cv = $('roll'), cx = cv.getContext('2d'), CW = cv.width, CH = cv.height, LH = CH / 4, WIN = 48, PX = CW / WIN;
function nowStep() {
  if (!playing || !ac || !placed.length) return 0;
  let s = placed[0][1], frac = 0;
  for (let i = 0; i < placed.length; i++) if (placed[i][0] <= ac.currentTime) { s = placed[i][1]; const nt = placed[i + 1] ? placed[i + 1][0] : placed[i][0] + 0.1; frac = (ac.currentTime - placed[i][0]) / (nt - placed[i][0]); }
  return s + Math.min(1, Math.max(0, frac));
}
function draw() {
  const sc = song.score, cur = nowStep(), cols = LANES.map((l) => css(l[2])), loopLen = sc.total - sc.loopStep;
  cx.fillStyle = css('--lcd'); cx.fillRect(0, 0, CW, CH);
  cx.fillStyle = css('--lcd-grid');
  for (let k = Math.ceil(cur - WIN / 3); k < cur + WIN; k++) if (k % song.beat === 0) cx.fillRect(Math.round((k - cur + WIN / 3) * PX), 0, k % song.bar === 0 ? 2 : 1, CH);
  for (let l = 1; l < 4; l++) cx.fillRect(0, l * LH, CW, 1);
  LANES.forEach(([ch], li) => {
    const top = li * LH;
    sc.ev[ch].forEach((e) => {
      [e.s, e.s + loopLen].forEach((s, rep) => {
        if (rep && e.s < sc.loopStep) return;
        const x = (s - cur + WIN / 3) * PX; if (x > CW || x + e.d * PX < 0) return;
        const on = playing && cur >= s && cur < s + e.d;
        cx.globalAlpha = muted[ch] ? 0.2 : on ? 1 : 0.55; cx.fillStyle = on ? '#FFF6D8' : cols[li];
        const notes = ch === 'noise' ? [null] : (e.ms || [e.m]);
        notes.forEach((m) => {
          let y;
          if (ch === 'noise') y = top + LH * ({ hat: 0.25, shaker: 0.2, rim: 0.4, scrape: 0.55, snare: 0.65, tom: 0.8 }[e.kind] || 0.5);
          else { const [lo, hi] = sc.range[ch]; y = top + LH - 6 - (m - lo) / (hi - lo) * (LH - 12); }
          cx.fillRect(Math.round(x) + 1, Math.round(y) - 2, Math.max(3, Math.round(e.d * PX) - 2), e.ms ? 3 : 4);
        });
      });
    });
  });
  cx.globalAlpha = 1; cx.fillStyle = 'rgba(255,246,216,0.35)'; cx.fillRect(Math.round(WIN / 3 * PX), 0, 2, CH);
  let si = 0; sc.marks.forEach((m) => { if (Math.floor(cur) >= m.step) si = m.si; });
  document.querySelectorAll('#map div').forEach((d) => d.classList.toggle('on', playing && +d.dataset.i === si));
  if (ac) $('astate').textContent = 'Audio: ' + ac.state + ' · ' + Math.round(ac.sampleRate / 100) / 10 + ' kHz';
  if (playing && timer) { $('where').textContent = 'Bar ' + (Math.floor(cur / song.bar) + 1) + ' · ' + song.sections[song.form[si]].name; const secs = ac.currentTime - startedAt; $('clock').textContent = Math.floor(secs / 60) + ':' + String(Math.floor(secs % 60)).padStart(2, '0'); }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) { stop(); setPlayLabel(); } });
})();
</script>
